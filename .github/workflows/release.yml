name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（手动触发时使用，例如 v0.1.0）
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 构建 · 精简版（需 .NET 10 桌面运行时）
        run: >
          dotnet publish src/DReaderNext/DReaderNext.csproj
          -c Release -r win-x64 --self-contained false
          /p:PublishSingleFile=true
          -o out/lite

      - name: 构建 · 免安装版（自带运行时）
        run: >
          dotnet publish src/DReaderNext/DReaderNext.csproj
          -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true
          /p:EnableCompressionInSingleFile=true
          -o out/standalone

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/pkg | Out-Null
          Copy-Item out/lite/DReaderNext.exe       out/pkg/DReaderNext-lite.exe
          Copy-Item out/standalone/DReaderNext.exe out/pkg/DReaderNext-standalone.exe
          Compress-Archive -Path out/pkg/* -DestinationPath out/DReaderNext.zip -Force
          Get-ChildItem out/pkg | ForEach-Object { "{0,-30} {1,12:N0} B" -f $_.Name, $_.Length }

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $notes = "两个文件功能完全相同，区别只在运行时怎么打包。`n`n" +
                   "- **DReaderNext-standalone.exe**（约 47 MB）：什么都不用装，双击即用 —— 首次使用建议选这个`n" +
                   "- **DReaderNext-lite.exe**（约 230 KB）：需先安装 .NET 10 桌面运行时`n" +
                   "- **DReaderNext.zip**：上述两个文件的压缩包`n`n" +
                   "操作方式见仓库 README：窗口无边框且背景透明，右键菜单是主要入口，老板键默认 Alt+3。"

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag out/DReaderNext.zip out/pkg/DReaderNext-lite.exe out/pkg/DReaderNext-standalone.exe --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag out/DReaderNext.zip out/pkg/DReaderNext-lite.exe out/pkg/DReaderNext-standalone.exe --repo $env:GITHUB_REPOSITORY --title "DReader-Next $tag" --notes $notes
          }
