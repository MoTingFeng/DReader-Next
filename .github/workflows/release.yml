name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（手动触发时使用，例如 v0.1.0）
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # net48 由 SDK 编译；本机/CI 都不需要 Developer Pack（csproj 里指向框架目录）
      - name: 构建
        run: dotnet publish src/DReaderNext/DReaderNext.csproj -c Release -o out/publish

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/pkg | Out-Null
          # exe 必须与同名的 .exe.config 放在一起：DPI（PerMonitorV2）声明就在里面
          Copy-Item out/publish/DReaderNext.exe        out/pkg/DReaderNext.exe
          Copy-Item out/publish/DReaderNext.exe.config out/pkg/DReaderNext.exe.config
          Compress-Archive -Path out/pkg/* -DestinationPath out/DReaderNext.zip -Force
          Get-ChildItem out/pkg | ForEach-Object { "{0,-24} {1,10:N0} B" -f $_.Name, $_.Length }
          "压缩包 {0:N0} B" -f (Get-Item out/DReaderNext.zip).Length

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG
          $notes = "免安装：下载 zip 解压后双击 DReaderNext.exe 即可，不需要任何运行时（Win10 21H2+ / Win11 自带 .NET Framework 4.8.1）。`n`n" +
                   "- **DReaderNext.zip**：`DReaderNext.exe` + `DReaderNext.exe.config`，**两个文件必须放在一起**`n" +
                   "- **DReaderNext.exe**：单独取用的话记得同时保留配套的 `.exe.config`（高 DPI 缩放与 DPI 感知声明在里面）`n`n" +
                   "本版要点：整体运行在 .NET Framework 4.8.1 上，单文件约 0.1 MB；`鼠标穿透` 默认关闭（窗口内任意位置都能拖动、点半区翻页、滚轮翻页、右键出菜单），可在右键菜单里切回穿透。`n`n" +
                   "操作方式见仓库 README：窗口无边框且背景透明，右键菜单是主要入口，老板键默认 Alt+3。"
          $files = @('out/DReaderNext.zip', 'out/pkg/DReaderNext.exe', 'out/pkg/DReaderNext.exe.config')

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --repo $env:GITHUB_REPOSITORY --title "DReader-Next $tag" --notes $notes
          }
