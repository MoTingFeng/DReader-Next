name: 问题反馈
description: 程序报错、显示不对、点了没反应等
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**请先附上诊断日志**——这一步能省掉大部分来回问的工夫：

        程序里右键 → 「导出诊断日志...」→ 选个位置保存 → 把生成的 zip **直接拖进下面的「诊断日志」框**。

        诊断包里的文件路径已经自动打码（只保留盘符与扩展名），里面只有运行环境和日志，**不含书的内容**。

  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 右键菜单 → 关于；或右键 exe → 属性 → 详细信息里的文件版本
      placeholder: 例如 v0.2.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本与显示缩放
      description: Win+R 输入 winver 看版本；缩放在「设置 → 系统 → 显示 → 缩放」；诊断包首页也有这两项
      placeholder: 例如 Windows 11 25H2 (Build 26200)，缩放 200%
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 越具体越好，能稳定重现最好
      placeholder: |
        1. 打开程序，拖入一个 txt
        2. 按住文字之间的空白处拖动
        3. 窗口不动
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望 vs 实际
      placeholder: |
        期望：窗口跟着鼠标移动
        实际：完全不动
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 诊断日志
      description: 把「导出诊断日志」生成的 zip 拖到这里（会自动作为附件上传）
      placeholder: 把 zip 拖进来即可
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我知道诊断包里的文件路径已打码，可以公开附在 issue 里
          required: true
